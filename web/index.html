<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>YOLO Polygon Lens</title>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bai+Jamjuree:wght@500;700&family=IBM+Plex+Sans+Thai:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
  <link rel="stylesheet" href="style.css">
</head>
<body>
<div class="wrap">
  <header>
    <h1><small>YOLO11n-seg · Polygon · 4 classes</small>YOLO Polygon Lens</h1>
    <div class="status"><span class="dot" id="dot"></span><span id="status">กำลังโหลดโมเดล…</span></div>
  </header>

  <div class="main">
    <section style="display:grid;gap:12px;min-width:0">
      <div class="plate" id="plate">
        <canvas id="cv" width="640" height="480"></canvas>
        <div class="drop" id="drop">ลากรูปมาวางที่นี่ หรือกด “เลือกรูป” ด้านล่าง<br>รองรับ JPG / PNG — ทำงานในเบราว์เซอร์ทั้งหมด ไม่อัปโหลดรูปขึ้นเซิร์ฟเวอร์</div>
      </div>
      <div class="toolbar">
        <label class="btn primary" for="file">เลือกรูปจากเครื่อง / ถ่ายรูป<input id="file" type="file" accept="image/*"></label>
        <button id="rerun" type="button">ทำนายใหม่</button>
        <span class="note">หรือวางรูปด้วย Ctrl+V</span>
      </div>
    </section>

    <aside class="side">
      <div class="card">
        <h2>ผลการทำนาย</h2>
        <div class="counts" id="counts"></div>
        <ul class="dets" id="dets"><li class="empty">ยังไม่มีผล — เลือกรูปเพื่อเริ่ม</li></ul>
        <div class="row lbl"><span>เวลา inference</span><span class="num" id="ms">–</span></div>
      </div>
      <div class="card">
        <h2>ตั้งค่า</h2>
        <div class="row"><label for="conf" class="lbl">Confidence</label><span class="num" id="confv">0.35</span></div>
        <input id="conf" type="range" min="0.05" max="0.95" step="0.05" value="0.35">
        <div class="row"><label for="iou" class="lbl">IoU (NMS)</label><span class="num" id="iouv">0.45</span></div>
        <input id="iou" type="range" min="0.1" max="0.9" step="0.05" value="0.45">
        <label class="chk" for="showMask"><input id="showMask" type="checkbox" checked> แสดง Polygon mask</label>
        <label class="chk" for="showBox"><input id="showBox" type="checkbox" checked> แสดงกรอบ (bounding box)</label>
        <div class="legend" id="legend"></div>
      </div>
    </aside>
  </div>


</div>


  <!-- onnxruntime-web ใช้รันไฟล์ .onnx บนเบราว์เซอร์ -->
  <script src="https://cdn.jsdelivr.net/npm/onnxruntime-web@1.20.1/dist/ort.wasm.min.js"></script>
  <script src="app.js"></script>
</body>
</html>
